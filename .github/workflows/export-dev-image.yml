name: Export tested DEV image

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: Exact tested commit to export
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate image commit
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - name: Registry login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export image and checksum
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/missrinam80-besc/besc-commandcenter:$IMAGE_SHA"
          docker pull "$IMAGE"
          docker image inspect --format '{{.Id}}' "$IMAGE" > image-id.txt
          docker save "$IMAGE" | gzip -1 > dev-image.tar.gz
          sha256sum dev-image.tar.gz > dev-image.sha256
      - name: Save private installation package
        uses: actions/upload-artifact@v7
        with:
          name: dev-image-${{ inputs.image_sha }}
          path: |
            dev-image.tar.gz
            dev-image.sha256
            image-id.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
