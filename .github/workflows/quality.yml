name: Kwaliteitscontrole

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  permissions-lint-build:
    name: Rechten, lint en build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres-concurrency:
        image: postgres:17.6
        env:
          POSTGRES_DB: besc_concurrency_fixture
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d besc_concurrency_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: pnpm instellen
        uses: pnpm/action-setup@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Dependencies installeren
        run: pnpm install --frozen-lockfile

      - name: Rechten- en auditcontroles uitvoeren
        run: pnpm test

      - name: Gelijktijdige dossierkoppeling en verwijdering controleren
        run: node tests/relationship-concurrency.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: besc_concurrency_fixture
          PGUSER: postgres
          PGPASSWORD: fixture-only

      - name: Keuzevelden en gelijktijdige verwijderbeveiliging controleren
        run: node tests/choice-concurrency.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: besc_concurrency_fixture
          PGUSER: postgres
          PGPASSWORD: fixture-only

      - name: Gelijktijdige bulkacties op materialen controleren
        run: node tests/asset-bulk-concurrency.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: besc_concurrency_fixture
          PGUSER: postgres
          PGPASSWORD: fixture-only

      - name: Gelijktijdige ticketaanvragen en verwerking controleren
        # Ticket tests refuse non-local databases; no Cloud access is involved.
        run: node tests/ticket-concurrency.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: besc_concurrency_fixture
          PGUSER: postgres
          PGPASSWORD: fixture-only

      - name: Materiaalreserveringen en centrale documentdeduplicatie controleren
        run: node tests/asset-fiche-concurrency.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: besc_concurrency_fixture
          PGUSER: postgres
          PGPASSWORD: fixture-only

      - name: Gelijktijdig Discordbotbeheer en typed ticketintake controleren
        run: node tests/discord-config-concurrency.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: besc_concurrency_fixture
          PGUSER: postgres
          PGPASSWORD: fixture-only

      - name: Kostindiening, omzetting en bewijsstukraces controleren
        run: node tests/expense-intake-concurrency.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: besc_concurrency_fixture
          PGUSER: postgres
          PGPASSWORD: fixture-only

      - name: DEV-tokenopslag bewaken
        run: python3 tests/test_besc_dev_agent_token.py

      - name: Codekwaliteit controleren
        run: pnpm run lint

      - name: Gegenereerde dossierbestanden controleren
        run: |
          node scripts/build-dossier-editor-schema.cjs --check
          node scripts/build-dossier-editor-migration.cjs --check

      - name: Productiebuild controleren
        run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://commandcenter.besc.be
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

      - name: Bot-API-routes en upstreamannulering controleren
        run: node scripts/check-bot-api-local.mjs

      - name: Ticket-API-routes en responsebodyannulering controleren
        run: node scripts/check-ticket-api-local.mjs

      - name: Discordconfiguratie- en typed-intakeroutes controleren
        run: node scripts/check-discord-config-api-local.mjs
